{% extends "base.html" %}
{% block title %}{{ product.name }}{% endblock %}
{% block content %}
<a href="{{ url_for('catalog.index') }}">← Product catalog</a>
<h1>{{ product.name }}</h1>
<p>{{ product.description }}</p>
<p><strong>{{ product.price_cents|euros }}</strong></p>
<p>SKU {{ product.sku }}</p>
{% endblock %}
